<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Bibliothèque BD</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Protection contre le copier-coller -->
    <script>
        // Bloquer l'inspection du code (F12, Ctrl+Shift+I)
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I')) {
                e.preventDefault();
                return false;
            }
        });
    </script>
</head>
<body>
    <!-- Écran d'accès avec code -->
    <div id="login-overlay" class="login-overlay">
        <div class="login-container">
            <h2>Accès à la bibliothèque BD</h2>
            <p>Veuillez entrer le code d'accès pour consulter les BDs</p>
            <div class="form-group">
                <input type="password" id="access-code" placeholder="Entrez le code d'accès" required autocomplete="off">
            </div>
            <button id="login-button">Accéder aux BDs</button>
            <p id="access-error" class="error-message"></p>
        </div>
    </div>

    <button class="hamburger-menu" id="menu-toggle">
        <i class="fas fa-bars"></i>
    </button>
    
    <div class="container">
        <div class="sidebar" id="sidebar">
            <h2>Mes BD</h2>
            <ul id="pdf-list">
                <!-- La liste sera chargée depuis le fichier JSON -->
            </ul>
            <div class="add-pdf">
                <h3>Ajouter une BD</h3>
                <form id="add-pdf-form">
                    <div class="form-group">
                        <label for="pdf-title">Titre:</label>
                        <input type="text" id="pdf-title" required>
                    </div>
                    <div class="form-group">
                        <label for="pdf-url">URL PubHTML5:</label>
                        <input type="text" id="pdf-url" placeholder="https://online.pubhtml5.com/xxxx/xxxx/" required>
                    </div>
                    <button type="submit">Ajouter</button>
                </form>
            </div>
        </div>
        <div class="main-content">
            <div id="pdf-container" class="not-authenticated">
                <div class="access-denied-message">
                    <i class="fas fa-lock fa-3x"></i>
                    <p>Veuillez entrer le code d'accès pour visualiser ce contenu</p>
                </div>
                <iframe id="pdf-frame" style="width:100%;height:100%" src="about:blank" seamless="seamless" scrolling="no" frameborder="0" allowtransparency="true" allowfullscreen="true"></iframe>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
